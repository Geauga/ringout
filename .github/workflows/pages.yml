# pages.yml
# Request: Build and test gameplay, the map library, and the local HTTP server.
name: Validate game
# Description: Validate the server-backed game; saved maps require its API.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable Corepack and install dependencies
        run: corepack enable pnpm && pnpm install
      - name: Build server
        run: node scripts/build.mjs
      - name: Test gameplay, editor, and map storage
        run: pnpm test
# Purpose: Check the server-backed game without exposing raw game assets through static Pages.
# Upstream: package.json test suite and scripts/build.mjs validate gameplay and map APIs.
# Environment: GitHub Actions / Node 24. Updated: 2026-09-23 America/New_York.
# Changes: lines 1-31 replace static deployment and PIN stripping with build/test validation.
